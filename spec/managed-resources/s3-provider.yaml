# A Managed Resource (MR) is a ready-made custom resource that manages something outside of the cluster
# A Provider installs support for a set of related managed resources, in this case AWS S3 MRs

apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-aws-s3
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3:v2.0.0
